<!doctype html><html lang="hi" data-language="bi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c33"><title>Little Learners / नन्हे शिक्षार्थी · LKG &amp; UKG</title><meta name="description" content="LKG and UKG playful bilingual learning in the same Vigyan Darshan site: English, Hindi, Maths, Our World and Art."><link rel="icon" href="../icon.svg"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="style.css"></head><body class="early"><a class="skip" href="#lessonTitle">Skip to learning | पाठ पर जाएँ</a><header class="topbar"><button id="menu" class="menuButton" aria-controls="lessonDrawer" aria-expanded="false" aria-label="Open lessons | पाठ खोलें">☰</button><a class="brand" href="../index.html"><span class="brandIcon">◈</span><span><span class="en">Vigyan Darshan</span><span class="hi">विज्ञान दर्शन</span></span></a><div class="courseBadge" id="courseBadge"></div><div class="topActions"><select id="language" aria-label="Language | भाषा"><option value="bi">EN + हिं</option><option value="en">EN only</option><option value="hi">हिं only</option></select><button id="theme" aria-label="Change theme | रंग बदलें">🌙</button><button id="settings" aria-label="Settings | सेटिंग" aria-expanded="false" aria-controls="settingsPanel">⚙</button><div id="settingsPanel" class="settingsPanel" hidden><p><span class="en">Text size</span><span class="sep"> | </span><span class="hi">अक्षर आकार</span></p><button data-font="15">A⁻</button><button data-font="17">A</button><button data-font="19">A⁺</button><p><label><input id="lowPower" type="checkbox"> <span class="en">Low power</span><span class="sep"> | </span><span class="hi">कम ऊर्जा</span></label></p></div></div></header><nav class="earlyTopNav"><a href="../index.html"><span class="en">All subjects</span><span class="sep"> | </span><span class="hi">सभी विषय</span></a><button id="home">Learning home | सीखने का घर</button></nav><nav id="classNav" class="classbar" aria-label="Choose class | कक्षा चुनें"></nav><nav id="subjectNav" class="earlySubjects" aria-label="Choose subject | विषय चुनें"></nav><div class="earlyLayout"><aside id="sidebar"><div id="sidebarContent"><h2 class="heading"><span class="en">Little steps</span><span class="hi">छोटे-छोटे कदम</span></h2><label for="search" class="sr">Search lessons | पाठ खोजें</label><input id="search" type="search" placeholder="Search lessons… | पाठ खोजें"><div id="lessonList"></div><p id="progressText"></p><progress id="progress" value="0" max="20" aria-label="Class progress | कक्षा की प्रगति"></progress></div></aside><main id="main"><section id="welcome"></section><section id="lesson" hidden><p id="lessonMeta" class="eyebrow"></p><h1 id="lessonTitle" class="heading" tabindex="-1"></h1><p id="goal" class="lessonGoal"></p><div class="lessonActions"><button id="finish" class="primary"></button><button id="print">Print revision card | दोहराव कार्ड प्रिंट करें</button></div><nav id="tabs" role="tablist" aria-label="Learning activities | सीखने की गतिविधियाँ"></nav><section id="explore" role="tabpanel"></section><section id="notes" role="tabpanel" hidden></section><section id="practice" role="tabpanel" hidden></section><section id="draw" role="tabpanel" hidden></section><section id="revision" role="tabpanel" hidden></section><div class="lessonBottom"><button id="previous">← Previous lesson | पिछला पाठ</button><button id="next">Next lesson → | अगला पाठ</button></div></section></main></div><dialog id="lessonDrawer" aria-labelledby="drawerTitle"><div class="drawerTop"><h2 id="drawerTitle" class="heading"><span class="en">Your lessons</span><span class="hi">आपके पाठ</span></h2><button id="closeDrawer" aria-label="Close lessons | पाठ बंद करें">✕</button></div><div id="drawerMount"></div></dialog><footer class="earlyFooter"><p id="basis"></p><p id="offline" role="status"></p><a href="https://ncert.nic.in/pdf/announcement/notices/digitaljaaduipitara_26_12_2023.pdf" target="_blank" rel="noopener"><span class="en">NCERT foundational-stage approach</span><span class="sep"> | </span><span class="hi">एनसीईआरटी का बुनियादी-स्तर दृष्टिकोण</span></a></footer><script type="module" src="app.js"></script><canvas id="celebration" aria-hidden="true"></canvas><script type="module">
// Child-friendly enhancement layer. Lesson data and the existing progress logic stay intact.
const celebrated=new Set(),motion=()=>!matchMedia('(prefers-reduced-motion: reduce)').matches&&document.documentElement.dataset.lowPower!=='true';
let raf=0,decorating=false;const celebration=document.getElementById('celebration');
function burst(){if(!motion()||document.hidden)return;cancelAnimationFrame(raf);const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;celebration.width=w*d;celebration.height=h*d;const c=celebration.getContext('2d');c.setTransform(d,0,0,d,0,0);const particles=Array.from({length:6},(_,i)=>({x:w*.5,y:h*.52,vx:(i-2.5)*45,vy:-200-i%3*25,color:['#1269ae','#ca4f78','#7e4abd','#1c874c','#d48712','#d65d22'][i]})),start=performance.now();const tick=now=>{const t=(now-start)/1000;c.clearRect(0,0,w,h);if(t>=1||document.hidden||!motion()){raf=0;return}for(const p of particles){c.globalAlpha=1-t;c.fillStyle=p.color;c.beginPath();c.arc(p.x+p.vx*t,p.y+p.vy*t+160*t*t,7,0,7);c.fill()}c.globalAlpha=1;raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
function decorate(){decorating=false;const stage=document.querySelector('.pictureStage');if(stage&&!stage.dataset.cheer){stage.dataset.cheer='true';stage.tabIndex=0;stage.setAttribute('role','button');stage.setAttribute('aria-label','Celebrate this card | इस कार्ड पर खुशी मनाएँ');const pop=()=>{stage.classList.remove('cheerPop');void stage.offsetWidth;stage.classList.add('cheerPop')};stage.addEventListener('click',e=>{if(!e.target.closest('button'))pop()});stage.addEventListener('keydown',e=>{if(e.target===stage&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pop()}})}
const status=document.getElementById('exploreStatus'),n=Number(status?.textContent.trim().match(/^([0-9]+)/)?.[1]||0),key=location.search+location.hash;if(n>=3&&!celebrated.has(key)){celebrated.add(key);burst()}}
const observer=new MutationObserver(()=>{if(!decorating){decorating=true;queueMicrotask(decorate)}});observer.observe(document.getElementById('main'),{childList:true,subtree:true});
// Attach to actual utterance lifecycle, not a guessed playback timeout.
if('speechSynthesis'in window){const synth=window.speechSynthesis,original=synth.speak.bind(synth),clear=()=>document.querySelectorAll('.audioSpeaking').forEach(b=>b.classList.remove('audioSpeaking'));try{synth.speak=function(utterance){const id=utterance.lang.startsWith('hi')?'listenHi':'listenEn';utterance.addEventListener('start',()=>{clear();document.getElementById(id)?.classList.add('audioSpeaking')},{once:true});utterance.addEventListener('end',clear,{once:true});utterance.addEventListener('error',clear,{once:true});return original(utterance)}}catch{}document.addEventListener('click',e=>{if(!e.target.closest('#listenHi,#listenEn'))clear()});document.addEventListener('visibilitychange',()=>{if(document.hidden)clear()})}
window.addEventListener('pagehide',()=>{cancelAnimationFrame(raf);observer.disconnect()});
</script></body></html>
